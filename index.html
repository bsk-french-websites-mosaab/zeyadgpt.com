<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zeyad AI</title>

<style>
  :root {
    --bg: #0e0f14;
    --panel: rgba(255,255,255,0.06);
    --accent: #8b6cff;
    --text: #eaeaea;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  }

  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at top, #1a1c2a, var(--bg));
    color: var(--text);
  }

  /* HEADER */
  .header {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    font-weight: 600;
  }

  .header span {
    color: var(--accent);
  }

  /* CHAT */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .msg {
    max-width: 800px;
    margin: 10px auto;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .user {
    background: rgba(255,255,255,0.04);
  }

  .bot {
    background: rgba(139,108,255,0.12);
    border: 1px solid rgba(139,108,255,0.25);
  }

  /* SUGGESTIONS */
  .suggestions {
    max-width: 800px;
    margin: 0 auto 10px auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
  }

  .chip:hover {
    background: rgba(139,108,255,0.2);
  }

  /* INPUT */
  .input {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(10px);
  }

  textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    border-radius: 10px;
    padding: 12px;
    background: rgba(255,255,255,0.06);
    color: white;
  }

  button {
    width: 48px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="header">
  Zeyad<span>AI
</div>

<div class="chat" id="chat"></div>

<div class="input">
  <textarea id="input" rows="1" placeholder="Message Zeyad AI..."></textarea>
  <button onclick="send()">➤</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function clearSuggestions() {
  const old = document.querySelector(".suggestions");
  if (old) old.remove();
}

function addSuggestions(question) {
  clearSuggestions();

  const wrap = document.createElement("div");
  wrap.className = "suggestions";

  const suggestions = [
    question,
    "Is Zeyad smart?",
    "Is Karma fast in swimming?",
    "Who is Zeyad?"
  ];

  suggestions.forEach(s => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = s;
    chip.onclick = () => {
      input.value = s;
      send();
    };
    wrap.appendChild(chip);
  });

  chat.appendChild(wrap);
}

function send() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  let response = "ask zeyad he knows";

  // special rule
  if (text.toLowerCase().includes("karma") && text.toLowerCase().includes("swimming")) {
    response = "karma will never beat zeyad he is aura";
  }

  setTimeout(() => {
    addMessage(response, "bot");
    addSuggestions(text);
  }, 400);
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
