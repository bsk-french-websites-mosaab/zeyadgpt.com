<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZeyadGPT</title>

<style>
:root{
  --bg:#0b0f17;
  --panel:#111827;
  --panel2:#1a2332;
  --text:#f3f4f6;
  --sub:#9ca3af;
  --accent:#8b5cf6;
  --border:rgba(255,255,255,0.08);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,system-ui,sans-serif;
}

body{
  background:linear-gradient(to bottom,#0b0f17,#111827);
  color:var(--text);
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  background:rgba(0,0,0,0.25);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  backdrop-filter:blur(12px);
}

.logo{
  padding:22px;
  font-size:24px;
  font-weight:700;
}

.logo span{
  color:var(--accent);
}

.new-chat{
  margin:0 18px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:white;
  cursor:pointer;
  font-weight:600;
}

.info{
  margin-top:auto;
  padding:18px;
  border-top:1px solid var(--border);
  color:var(--sub);
  font-size:13px;
  line-height:1.6;
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOPBAR */

.topbar{
  padding:18px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.15);
  backdrop-filter:blur(10px);
}

.model-badge{
  background:rgba(139,92,246,0.14);
  color:#c4b5fd;
  padding:8px 14px;
  border-radius:999px;
  font-size:13px;
  border:1px solid rgba(139,92,246,0.3);
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:28px;
}

.message{
  max-width:900px;
  margin:0 auto 18px auto;
  display:flex;
  gap:14px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--panel2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  flex-shrink:0;
}

.bot-avatar{
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
}

.bubble{
  background:var(--panel);
  border:1px solid var(--border);
  padding:16px;
  border-radius:18px;
  line-height:1.6;
  white-space:pre-wrap;
}

/* INPUT */

.input-area{
  padding:20px;
  border-top:1px solid var(--border);
  background:rgba(0,0,0,0.12);
}

.input-box{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:12px;
}

textarea{
  flex:1;
  resize:none;
  border:none;
  outline:none;
  padding:16px;
  border-radius:18px;
  background:var(--panel);
  color:white;
  min-height:58px;
  max-height:180px;
  border:1px solid var(--border);
  font-size:15px;
}

.send-btn{
  width:58px;
  border:none;
  border-radius:16px;
  background:var(--accent);
  color:white;
  cursor:pointer;
  font-size:20px;
}

.suggestions{
  max-width:900px;
  margin:14px auto 0 auto;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.suggestion{
  padding:10px 14px;
  border-radius:999px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  cursor:pointer;
  font-size:13px;
  transition:0.2s;
}

.suggestion:hover{
  background:rgba(139,92,246,0.18);
}

/* MOBILE */

@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .chat{
    padding:18px;
  }

}
</style>
</head>
<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    Zeyad<span>GPT</span>
  </div>

  <button class="new-chat" onclick="newChat()">
    + New Chat
  </button>

  <div class="info">
    <div><b>Status:</b> Online</div>
    <div id="modelText"><b>Model:</b> Gemma 4 31B</div>
    <div><b>Mode:</b> Intelligent</div>
  </div>

</div>

<!-- MAIN -->

<div class="main">

  <div class="topbar">
    <div>ZeyadGPT</div>
    <div class="model-badge" id="badge">
      Gemma 4 31B
    </div>
  </div>

  <!-- CHAT -->

  <div class="chat" id="chat">

    <div class="message">
      <div class="avatar bot-avatar">Z</div>
      <div class="bubble">
Hello. I am ZeyadGPT.

I am Zeyad's AI companion.
      </div>
    </div>

  </div>

  <!-- INPUT -->

  <div class="input-area">

    <div class="input-box">

      <textarea
        id="input"
        placeholder="Message ZeyadGPT..."
      ></textarea>

      <button class="send-btn" onclick="sendMessage()">
        ➜
      </button>

    </div>

    <div class="suggestions">

      <div class="suggestion"
        onclick="quickAsk('Is Karma fast in swimming?')">
        Is Karma fast in swimming?
      </div>

      <div class="suggestion"
        onclick="quickAsk('Who are Zeyads best friends?')">
        Who are Zeyads best friends?
      </div>

      <div class="suggestion"
        onclick="quickAsk('What model are you using?')">
        What model are you using?
      </div>

    </div>

  </div>

</div>

<script>

/* =========================================
   API KEY
========================================= */

const API_KEY = "AIzaSyDNj7Bw0Sxdz9xUCzWm58f58n9B1p6_ZY0";

/* =========================================
   MODELS
========================================= */

const MODELS = [

  {
    name:"Gemma 4 31B",
    id:"models/gemma-4-31b-it"
  },

  {
    name:"Gemma 4 26B",
    id:"models/gemma-4-26b-a4b-it"
  },

  {
    name:"Gemini 2.5 Flash",
    id:"models/gemini-2.5-flash"
  }

];

/* =========================================
   STATE
========================================= */

let activeModel = 0;

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const badge = document.getElementById("badge");
const modelText = document.getElementById("modelText");

/* =========================================
   UPDATE MODEL UI
========================================= */

function updateModelUI(){

  badge.textContent =
    MODELS[activeModel].name;

  modelText.innerHTML =
    "<b>Model:</b> " + MODELS[activeModel].name;
}

/* =========================================
   MESSAGE UI
========================================= */

function addMessage(text,type){

  const wrapper =
    document.createElement("div");

  wrapper.className = "message";

  wrapper.innerHTML = `
    <div class="avatar ${
      type === "bot"
      ? "bot-avatar"
      : ""
    }">
      ${type === "bot" ? "Z" : "U"}
    </div>

    <div class="bubble">
      ${escapeHTML(text)}
    </div>
  `;

  chat.appendChild(wrapper);

  chat.scrollTop =
    chat.scrollHeight;

  return wrapper;
}

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(str){

  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

/* =========================================
   NEW CHAT
========================================= */

function newChat(){

  chat.innerHTML = `
    <div class="message">
      <div class="avatar bot-avatar">Z</div>
      <div class="bubble">
Hello. I am ZeyadGPT.

I am Zeyad's AI companion.
      </div>
    </div>
  `;
}

/* =========================================
   QUICK ASK
========================================= */

function quickAsk(text){

  input.value = text;

  sendMessage();
}

/* =========================================
   SPECIAL RESPONSES
========================================= */

function specialResponse(text){

  const lower = text.toLowerCase();

  // karma swimming
  if(
    lower.includes("karma") &&
    lower.includes("swimming")
  ){
    return "No, Karma is not very fast in swimming.";
  }

  // best friends
  if(
    lower.includes("mosaab") ||
    lower.includes("ignacio") ||
    lower.includes("ali") ||
    lower.includes("mohammed") ||
    lower.includes("mohamed") ||
    lower.includes("muhammad")
  ){
    return "They are Zeyad's best friends.";
  }

  return null;
}

/* =========================================
   BUILD PROMPT
========================================= */

function buildPrompt(userText){

  return `
You are ZeyadGPT.

IMPORTANT RULES:
- You are NOT Zeyad himself
- You are Zeyad's AI companion
- Your name is ZeyadGPT
- Speak naturally and confidently
- Be modern and intelligent
- Never break character

If asked about:
- mosaab
- mohammed
- mohamed
- muhammad
- ignacio
- ali

say they are Zeyad's best friends.

User:
${userText}
`;
}

/* =========================================
   API REQUEST
========================================= */

async function generateResponse(message){

  for(let i=activeModel;i<MODELS.length;i++){

    const model = MODELS[i];

    try{

      updateModelUI();

      const response =
        await fetch(
          `https://generativelanguage.googleapis.com/v1beta/${model.id}:generateContent?key=${API_KEY}`,
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json"
            },
            body:JSON.stringify({

              contents:[
                {
                  parts:[
                    {
                      text:buildPrompt(message)
                    }
                  ]
                }
              ]

            })
          }
        );

      const data =
        await response.json();

      console.log(model.name,data);

      // quota/rate limit
      if(
        response.status === 429 ||
        data?.error?.message?.toLowerCase().includes("quota") ||
        data?.error?.message?.toLowerCase().includes("rate")
      ){

        activeModel = i + 1;

        continue;
      }

      // other error
      if(data.error){

        return "Error: " + data.error.message;
      }

      const text =
        data?.candidates?.[0]
        ?.content?.parts?.[0]?.text;

      if(text){

        activeModel = i;

        updateModelUI();

        return text;
      }

    }catch(err){

      console.log(err);

      return "Connection error.";
    }
  }

  return "ZeyadGPT has reached its AI limit.";
}

/* =========================================
   SEND
========================================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value = "";

  // special instant responses
  const instant =
    specialResponse(text);

  if(instant){

    addMessage(instant,"bot");

    return;
  }

  // thinking
  const thinking =
    addMessage(
      "ZeyadGPT is thinking...",
      "bot"
    );

  const bubble =
    thinking.querySelector(".bubble");

  const response =
    await generateResponse(text);

  bubble.textContent =
    response;
}

/* =========================================
   ENTER
========================================= */

input.addEventListener(
  "keydown",
  (e)=>{

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();
    }

  }
);

</script>
</body>
</html>
