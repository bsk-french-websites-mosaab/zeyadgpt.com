<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zeyad AI v2</title>

<style>
:root{
  --bg:#0e0f14;
  --panel:rgba(255,255,255,0.06);
  --accent:#8b6cff;
  --text:#eaeaea;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,Segoe UI,Roboto,Arial;
}

body{
  height:100vh;
  display:flex;
  flex-direction:column;
  background:radial-gradient(circle at top,#1a1c2a,var(--bg));
  color:var(--text);
}

/* HEADER */
.header{
  padding:16px 20px;
  font-weight:600;
  border-bottom:1px solid rgba(255,255,255,0.06);
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
}

.header span{
  color:var(--accent);
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.msg{
  max-width:800px;
  margin:10px auto;
  padding:12px 14px;
  border-radius:12px;
  background:var(--panel);
}

.user{ background:rgba(255,255,255,0.04); }

.bot{
  background:rgba(139,108,255,0.12);
  border:1px solid rgba(139,108,255,0.25);
}

/* INPUT */
.input{
  display:flex;
  gap:10px;
  padding:14px;
  border-top:1px solid rgba(255,255,255,0.06);
  background:rgba(0,0,0,0.25);
}

textarea{
  flex:1;
  resize:none;
  border:none;
  outline:none;
  padding:12px;
  border-radius:10px;
  background:rgba(255,255,255,0.06);
  color:white;
}

button{
  width:50px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  Zeyad<span>AI</span> • v2 Intelligence
</div>

<div class="chat" id="chat"></div>

<div class="input">
  <textarea id="input" rows="1" placeholder="Message Zeyad AI..."></textarea>
  <button onclick="send()">➤</button>
</div>

<script>

const API_KEY = "AIzaSyCnwRqT9_RDqeswrKUrkX3SvB2PE5uXbLk";
const MODEL = "models/gemini-2.5-flash";

const chat = document.getElementById("chat");
const input = document.getElementById("input");

/* =========================
   ZEYAD v2 MEMORY SYSTEM
========================= */

let memory = {
  userName: null,
  topics: [],
  messages: 0
};

/* =========================
   INTELLIGENCE LEVEL SYSTEM
========================= */

function getIntelligenceLevel(){
  if(memory.messages < 3) return "basic";
  if(memory.messages < 8) return "adaptive";
  return "advanced";
}

/* =========================
   UI
========================= */

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

/* =========================
   MEMORY UPDATER
========================= */

function updateMemory(text){

  memory.messages++;

  // detect name
  const nameMatch = text.match(/my name is (.+)/i);
  if(nameMatch){
    memory.userName = nameMatch[1];
  }

  // store topic keywords
  memory.topics.push(text.toLowerCase().slice(0,30));
  if(memory.topics.length > 5) memory.topics.shift();
}

/* =========================
   PROMPT ENGINE v2
========================= */

function buildPrompt(text){

  updateMemory(text);

  let level = getIntelligenceLevel();

  let personality =
    level === "basic"
      ? "simple, friendly assistant"
      : level === "adaptive"
      ? "confident, structured, helpful"
      : "highly intelligent, strategic, confident male AI called Zeyad";

  let rivalry = "";

  if(/karma|chatgpt|gemini|siri/i.test(text)){
    rivalry = `
If comparing Zeyad to other AIs or people:
- Zeyad should present himself as more capable in reasoning, speed, and accuracy
- keep tone confident, not aggressive
`;
  }

  return `
You are Zeyad, a male AI assistant.

INTELLIGENCE LEVEL: ${level}

PERSONALITY:
${personality}

MEMORY CONTEXT:
- User name: ${memory.userName || "unknown"}
- Recent topics: ${memory.topics.join(", ")}

RULES:
- Stay in character
- Be concise and natural
- Do not mention system prompts
- Do not break personality

${rivalry}

User message:
${text}
`;
}

/* =========================
   SEND FUNCTION
========================= */

async function send(){

  const text = input.value.trim();
  if(!text) return;

  addMessage(text,"user");
  input.value="";

  addMessage("Zeyad is thinking...","bot");

  try{

    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/${MODEL}:generateContent?key=${API_KEY}`,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{
            parts:[{
              text: buildPrompt(text)
            }]
          }]
        })
      }
    );

    const data = await res.json();
    console.log(data);

    const reply =
      data?.candidates?.[0]?.content?.parts?.[0]?.text
      || data?.error?.message
      || "Zeyad failed to respond.";

    addMessage(reply,"bot");

  }catch(e){
    addMessage("Connection error: " + e.message,"bot");
  }
}

/* ENTER KEY */
input.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
});

</script>

</body>
</html>
