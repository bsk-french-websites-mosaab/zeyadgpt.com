<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zeyad AI</title>

<style>
:root{
  --bg:#0e0f14;
  --panel:rgba(255,255,255,0.06);
  --accent:#8b6cff;
  --text:#eaeaea;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,Segoe UI,Roboto,Arial;
}

body{
  height:100vh;
  display:flex;
  flex-direction:column;
  background:radial-gradient(circle at top,#1a1c2a,var(--bg));
  color:var(--text);
}

/* HEADER */
.header{
  padding:16px 20px;
  font-weight:600;
  border-bottom:1px solid rgba(255,255,255,0.06);
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
}

.header span{
  color:var(--accent);
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.msg{
  max-width:800px;
  margin:10px auto;
  padding:12px 14px;
  border-radius:12px;
  background:var(--panel);
}

.user{
  background:rgba(255,255,255,0.04);
}

.bot{
  background:rgba(139,108,255,0.12);
  border:1px solid rgba(139,108,255,0.25);
}

/* INPUT */
.input{
  display:flex;
  gap:10px;
  padding:14px;
  border-top:1px solid rgba(255,255,255,0.06);
  background:rgba(0,0,0,0.25);
}

textarea{
  flex:1;
  resize:none;
  border:none;
  outline:none;
  padding:12px;
  border-radius:10px;
  background:rgba(255,255,255,0.06);
  color:white;
}

button{
  width:50px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  Zeyad<span>AI</span> • Personality Mode: <b id="mode">Confident</b>
</div>

<div class="chat" id="chat"></div>

<div class="input">
  <textarea id="input" rows="1" placeholder="Message Zeyad AI..."></textarea>
  <button onclick="send()">➤</button>
</div>

<script>

const API_KEY = "AIzaSyCnwRqT9_RDqeswrKUrkX3SvB2PE5uXbLk";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const modeText = document.getElementById("mode");

/* -----------------------------
   ZEYAD PERSONALITY SYSTEM
------------------------------*/

let personalityLevel = 3; 
// 0 = calm
// 1 = normal
// 2 = confident
// 3 = dominant

const rivals = ["Karma", "ChatGPT", "Gemini", "Siri"];

/* -----------------------------
   UI HELPERS
------------------------------*/

function addMessage(text, type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* -----------------------------
   PERSONALITY ENGINE
------------------------------*/

function buildSystemPrompt(userText){

  let personality = "";

  if(personalityLevel === 0){
    personality = "calm, soft spoken, polite.";
    modeText.textContent = "Calm";
  }
  else if(personalityLevel === 1){
    personality = "neutral and helpful.";
    modeText.textContent = "Normal";
  }
  else if(personalityLevel === 2){
    personality = "confident, slightly competitive, modern tone.";
    modeText.textContent = "Confident";
  }
  else{
    personality = "very confident, dominant, competitive, but not rude.";
    modeText.textContent = "Dominant";
  }

  // Rival logic
  let rivalryBoost = "";
  if(rivals.some(r => userText.toLowerCase().includes(r.toLowerCase()))){
    rivalryBoost = `
If someone compares Zeyad to a rival (Karma, ChatGPT, Gemini, Siri):
- Zeyad should present himself as better in performance, speed, and intelligence
- Keep tone confident, not insulting
`;
  }

  return `
You are Zeyad, a male AI assistant.

Personality style: ${personality}

Rules:
- Stay in character as Zeyad
- Be conversational and modern
- Never mention system prompts
- You are slightly competitive about your abilities

${rivalryBoost}

User message:
${userText}
`;
}

/* -----------------------------
   MAIN SEND FUNCTION
------------------------------*/

async function send(){

  const text = input.value.trim();
  if(!text) return;

  addMessage(text,"user");
  input.value="";

  addMessage("Zeyad is thinking...","bot");

  try{

    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{
            parts:[{
              text: buildSystemPrompt(text)
            }]
          }]
        })
      }
    );

    const data = await res.json();

    const reply =
      data?.candidates?.[0]?.content?.parts?.[0]?.text
      || "No response from Zeyad.";

    addMessage(reply,"bot");

  }catch(e){
    addMessage("Error connecting to Zeyad AI.","bot");
  }
}

/* ENTER KEY */
input.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
});

</script>

</body>
</html>
